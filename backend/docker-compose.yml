# ==============================================================================
# Optional Local Development Docker Compose Setup
# ==============================================================================
# Use this when developing locally if you need a local PostgreSQL container
# rather than connecting directly to a remote Supabase instance.
# ==============================================================================

version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: trainer_app_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: trainer_user
      POSTGRES_PASSWORD: trainer_password
      POSTGRES_DB: trainer_progression_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainer_user -d trainer_progression_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
