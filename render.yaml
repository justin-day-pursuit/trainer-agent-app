# Render builds only the backend directory, keeping frontend files and local secrets
# outside the image context. Dashboard values remain manual so none enter Git.
services:
  - type: web
    name: trainer-progression-api
    # Free is 0.1 CPU and 512 MB. The service sleeps after 15 minutes without
    # traffic and wakes on the next request. Change this only if Justin asks
    # for a paid instance.
    plan: free
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ENVIRONMENT
        sync: false
      - key: DEBUG
        sync: false
